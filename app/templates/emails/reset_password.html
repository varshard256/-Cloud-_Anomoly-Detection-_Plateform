<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="color:#0B1120;">Reset your password</h2>
  <p>Hi {{ user.name }},</p>
  <p>We received a request to reset your NeuroCloud password. Click the button below to choose a new one. This link expires in 1 hour.</p>
  <p style="margin: 24px 0;">
    <a href="{{ reset_url }}" style="background:#2563EB; color:#06201C; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight:bold;">Reset Password</a>
  </p>
  <p style="color:#666; font-size:13px;">If you didn't request this, you can safely ignore this email.</p>
</div>
