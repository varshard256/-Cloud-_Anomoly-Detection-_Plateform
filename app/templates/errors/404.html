{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<section class="container text-center" style="padding: 6rem 0;">
  <svg viewBox="0 0 400 120" style="width:280px; height:auto; margin:0 auto 1.5rem; display:block;">
    <polyline points="0,60 60,60 90,20 120,100 150,60 400,60" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <line x1="90" y1="0" x2="90" y2="120" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,4"/>
  </svg>
  <h1 class="mono" style="font-size:3rem;">404</h1>
  <p style="color:var(--text-muted);">That page doesn't exist in this environment.</p>
  <a href="{{ url_for('main.home') }}" class="btn btn-signal mt-3">Back to Home</a>
</section>
{% endblock %}
